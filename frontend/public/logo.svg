<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <!-- Definições de Estilos e Fontes -->
  <defs>
    <style>
      .text-loc { font-family: 'Outfit', 'Arial Black', sans-serif; font-size: 72px; font-weight: 900; fill: #0A5294; }
      .text-insight { font-family: 'Outfit', 'Plus Jakarta Sans', sans-serif; font-size: 72px; font-weight: 500; fill: #F27A22; }
      .text-sub { font-family: 'Plus Jakarta Sans', 'Arial', sans-serif; font-size: 20px; font-weight: 700; fill: #526071; letter-spacing: 0.25em; }
    </style>
  </defs>

  <!-- Grupo do Logotipo (Desenho da Betoneira e Seta) -->
  <g transform="translate(20, 20)">
    <!-- Arco Azul Superior com Seta -->
    <path d="M 70,120 A 75,75 0 1,1 190,100" fill="none" stroke="#0A5294" stroke-width="12" stroke-linecap="round" />
    <polygon points="190,85 215,100 185,120" fill="#0A5294" />

    <!-- Estrutura da Betoneira (Laranja) -->
    <!-- Suporte Traseiro e Rodas -->
    <line x1="60" y1="230" x2="160" y2="230" stroke="#F27A22" stroke-width="10" stroke-linecap="round" />
    <line x1="80" y1="180" x2="80" y2="230" stroke="#F27A22" stroke-width="10" stroke-linecap="round" />
    <line x1="160" y1="180" x2="160" y2="260" stroke="#F27A22" stroke-width="10" stroke-linecap="round" />
    <line x1="160" y1="260" x2="180" y2="260" stroke="#F27A22" stroke-width="10" stroke-linecap="round" />

    <!-- Rodinha Esquerda -->
    <circle cx="80" cy="235" r="20" fill="#060a13" stroke="#F27A22" stroke-width="8" />
    <circle cx="80" cy="235" r="5" fill="#F27A22" />

    <!-- Quadro Principal -->
    <path d="M 80,180 L 160,180 L 140,110 L 80,180" fill="none" stroke="#F27A22" stroke-width="10" stroke-linejoin="round" />
    
    <!-- Caixa do Motor (Laranja, lateral esquerda) -->
    <path d="M 40,140 L 75,120 L 75,190 L 40,190 Z" fill="#F27A22" />
    <line x1="48" y1="150" x2="67" y2="150" stroke="#060a13" stroke-width="3" />
    <line x1="48" y1="160" x2="67" y2="160" stroke="#060a13" stroke-width="3" />
    <line x1="48" y1="170" x2="67" y2="170" stroke="#060a13" stroke-width="3" />

    <!-- Tambor da Betoneira (Inclinada a 45 graus) -->
    <!-- Base do Tambor (Azul Escuro) -->
    <path d="M 100,160 L 150,110 L 175,135 L 125,185 Z" fill="#0A5294" />
    <!-- Corpo Principal do Tambor (Laranja) -->
    <path d="M 105,155 L 145,115 C 165,95 195,110 205,120 L 145,180 Z" fill="#F27A22" />
    <!-- Anel do Tambor (Laranja Claro / Destaque) -->
    <path d="M 125,135 L 175,85 C 185,95 200,110 190,120 L 140,170 Z" fill="#F27A22" opacity="0.9" />
    <!-- Boca do Tambor -->
    <ellipse cx="185" cy="100" rx="12" ry="22" transform="rotate(-40, 185, 100)" fill="#060a13" stroke="#F27A22" stroke-width="6" />

    <!-- Volante de Basculamento (Laranja, lateral direita) -->
    <circle cx="185" cy="160" r="22" fill="none" stroke="#F27A22" stroke-width="6" />
    <line x1="185" y1="138" x2="185" y2="182" stroke="#F27A22" stroke-width="6" />
    <line x1="163" y1="160" x2="207" y2="160" stroke="#F27A22" stroke-width="6" />
  </g>

  <!-- Textos do Logotipo -->
  <g transform="translate(260, 140)">
    <!-- LOC -->
    <text x="0" y="0" class="text-loc">LOC</text>
    <!-- iNSIGHT -->
    <text x="165" y="0" class="text-insight">iNSIGHT</text>
    <!-- Pingo no i -->
    <circle cx="182" cy="-60" r="8" fill="#F27A22" />
    
    <!-- Slogan/Subtítulo -->
    <text x="5" y="45" class="text-sub">LOCAÇÃO DE MATERIAIS DE CONSTRUÇÃO</text>
  </g>
</svg>
